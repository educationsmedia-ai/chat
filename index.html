<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Chat</title>
    <meta name="description" content="Aplikasi web Live Chat grup real-time untuk hingga 20 orang dengan fitur obrolan instan, kirim foto, dan panggilan video WebRTC langsung tanpa kode room." />
    <meta property="og:title" content="Live Chat" />
    <meta property="og:description" content="Aplikasi web Live Chat grup real-time untuk hingga 20 orang dengan fitur obrolan instan, kirim foto, dan panggilan video WebRTC langsung tanpa kode room." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#10b981" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            // Check for updates on load
            reg.update().catch(() => {});
          }).catch(function() {});
        });
      }
    </script>
  </head>
  <body style="background-color: #09090b; color: #f4f4f5; margin: 0; font-family: system-ui, -apple-system, sans-serif;">
    <div id="root">
      <div id="initial-splash-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center;">
        <div style="width: 44px; height: 44px; border: 3px solid #27272a; border-top-color: #10b981; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px;"></div>
        <div style="font-size: 18px; font-weight: 700; color: #ffffff; letter-spacing: -0.02em; margin-bottom: 6px;">Live Chat</div>
        <div style="font-size: 13px; color: #a1a1aa; max-width: 320px; line-height: 1.5;">Menghubungkan aplikasi real-time...</div>
        
        <div id="cache-recovery-btn" style="display: none; margin-top: 24px;">
          <button onclick="if('caches' in window){caches.keys().then(k=>k.forEach(c=>caches.delete(c)));}if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(s=>s.unregister()));}localStorage.clear();window.location.reload();" style="background: #18181b; border: 1px solid #3f3f46; color: #34d399; font-size: 12px; font-weight: 600; padding: 10px 18px; border-radius: 10px; cursor: pointer;">
            Muat Ulang & Bersihkan Cache
          </button>
        </div>
      </div>
      <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
      <script>
        setTimeout(() => {
          const btn = document.getElementById('cache-recovery-btn');
          if (btn && document.getElementById('initial-splash-loader')) {
            btn.style.display = 'block';
          }
        }, 4000);
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
